<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MindGuard AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 300px;
    background: #0a1220;
    color: #ccddf0;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 13px;
  }
  .header {
    padding: 16px 18px 14px;
    background: linear-gradient(140deg, #0e1e30, #091520);
    border-bottom: 1px solid rgba(100,160,220,0.1);
  }
  .title-row { display: flex; align-items: center; gap: 9px; }
  .title-row h2 { font-size: 16px; font-weight: 700; color: #bcd4ee; }
  .ai-pill {
    display: flex; align-items: center; gap: 6px;
    margin-top: 10px; padding: 6px 10px;
    border-radius: 8px; font-size: 11.5px;
    background: rgba(80,140,220,0.1);
    border: 1px solid rgba(80,140,220,0.2);
    color: rgba(160,200,245,0.8);
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #5a9fd4;
    box-shadow: 0 0 5px #5a9fd4; animation: blink 2s infinite; flex-shrink:0; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .section { padding: 12px 18px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
    color: rgba(180,210,245,0.3); margin-bottom: 10px; }

  .event-item { display: flex; gap: 8px; padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04); }
  .event-item:last-child { border-bottom: none; }
  .tier-badge { font-size: 10px; font-weight: 700; padding: 2px 6px;
    border-radius: 4px; flex-shrink: 0; margin-top: 1px; }
  .tier-critical { background: rgba(220,80,80,0.2); color: #e07070; }
  .tier-high { background: rgba(220,140,60,0.2); color: #d09060; }
  .tier-moderate { background: rgba(80,140,220,0.2); color: #6090c8; }
  .event-host { font-size: 12px; color: rgba(210,230,248,0.75); }
  .event-meta { font-size: 10.5px; color: rgba(180,210,245,0.3); margin-top: 1px; }
  .empty { text-align:center; color: rgba(180,210,245,0.28); padding: 16px 0; font-size: 12px; }
  .events-list { max-height: 150px; overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: rgba(80,140,220,0.3) transparent; }

  .clear-btn { width:100%; margin-top:10px; padding: 7px;
    border-radius: 7px; font-size: 11.5px; cursor: pointer;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
    color: rgba(200,220,245,0.35); transition: all 0.18s; }
  .clear-btn:hover { background: rgba(220,80,80,0.1); border-color: rgba(220,80,80,0.25); color: #d07070; }

  .stats { display: flex; gap: 8px; }
  .stat { flex:1; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
    border-radius: 8px; padding: 10px; text-align:center; }
  .stat-val { font-size: 22px; font-weight: 700; color: #7aafdd; }
  .stat-lbl { font-size: 10px; color: rgba(180,210,245,0.3); margin-top: 2px; }

  .footer { padding: 10px 18px; text-align:center; font-size: 10.5px; color: rgba(180,210,245,0.2); }
</style>
</head>
<body>
<div class="header">
  <div class="title-row">
    <span style="font-size:20px">🛡️</span>
    <h2>MindGuard AI</h2>
  </div>
  <div class="ai-pill">
    <div class="dot"></div>
    <span id="ai-status-text">Gemini AI active · loading…</span>
  </div>
</div>

<div class="section">
  <div class="section-label">Stats</div>
  <div class="stats">
    <div class="stat"><div class="stat-val" id="stat-ai">—</div><div class="stat-lbl">AI Analyses</div></div>
    <div class="stat"><div class="stat-val" id="stat-ev">—</div><div class="stat-lbl">Detected</div></div>
  </div>
</div>

<div class="section">
  <div class="section-label">Recent Detections</div>
  <div class="events-list" id="events-list">
    <div class="empty">No signals detected yet 💙</div>
  </div>
  <button class="clear-btn" id="clear-btn">Clear history</button>
</div>

<div class="footer">🔒 All data stays on your device</div>

<script>
  chrome.storage.local.get(['aiCallCount','events'], (data) => {
    document.getElementById('stat-ai').textContent = data.aiCallCount || 0;
    document.getElementById('stat-ev').textContent = (data.events || []).length;
    document.getElementById('ai-status-text').textContent =
      `Gemini AI active · ${data.aiCallCount || 0} analyses run`;

    const events = data.events || [];
    if (!events.length) return;
    const list = document.getElementById('events-list');
    list.innerHTML = '';
    events.slice(0, 8).forEach(ev => {
      const src = ev.source === 'gemini-ai' ? '🤖' : '🔍';
      const el = document.createElement('div');
      el.className = 'event-item';
      el.innerHTML = `<span class="tier-badge tier-${ev.tier}">${ev.tier}</span>
        <div><div class="event-host">${ev.hostname}</div>
        <div class="event-meta">${src} ${ev.time}</div></div>`;
      list.appendChild(el);
    });
  });

  document.getElementById('clear-btn').addEventListener('click', () => {
    chrome.runtime.sendMessage({ type: 'CLEAR_EVENTS' }, () => {
      document.getElementById('events-list').innerHTML = '<div class="empty">No signals detected yet 💙</div>';
      document.getElementById('stat-ev').textContent = '0';
    });
  });
</script>
</body>
</html>
